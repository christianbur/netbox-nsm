{% load i18n %}
{% if node.ipam_object_ref and node.ipam_object_ref.dns_name %}
<div class="nsm-ipa-cell-ipam-dns">
  {% if node.ipam_object_ref.url %}
  <a href="{{ node.ipam_object_ref.url }}" class="nsm-ipa-cell-ipam-dns-link" title="{{ node.ipam_object_ref.dns_name }}">{{ node.ipam_object_ref.dns_name }}</a>
  {% else %}
  <span class="nsm-ipa-cell-ipam-dns-text">{{ node.ipam_object_ref.dns_name }}</span>
  {% endif %}
</div>
{% else %}
<span class="text-muted">—</span>
{% endif %}
