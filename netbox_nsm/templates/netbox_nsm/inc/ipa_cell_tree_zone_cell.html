{% load i18n %}
{% if node.zone_refs %}
<div class="nsm-ipa-cell-zone-refs">
  {% for ref in node.zone_refs %}
  {% if ref.url %}
  <a href="{{ ref.url }}" class="nsm-ipa-cell-zone-link" title="{% if ref.found_on_prefix %}{{ ref.name }} ({{ ref.found_on_prefix }}){% elif ref.inherited %}{% blocktrans with prefix=ref.inherited_from %}Inherited from {{ prefix }}{% endblocktrans %}{% else %}{{ ref.name }}{% endif %}">{{ ref.name }}</a>{% if not forloop.last %}<span class="text-muted">, </span>{% endif %}
  {% else %}
  <span class="nsm-ipa-cell-zone-text" title="{% if ref.found_on_prefix %}{{ ref.name }} ({{ ref.found_on_prefix }}){% elif ref.inherited %}{% blocktrans with prefix=ref.inherited_from %}Inherited from {{ prefix }}{% endblocktrans %}{% endif %}">{{ ref.name }}</span>{% if not forloop.last %}<span class="text-muted">, </span>{% endif %}
  {% endif %}
  {% endfor %}
</div>
{% else %}
<span class="text-muted">—</span>
{% endif %}
