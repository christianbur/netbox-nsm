{% load i18n ag_grid_vendor %}
<div class="nsm-ag-status-bar" aria-live="polite">
  <div class="nsm-ag-status-bar-stats">
    <span id="{{ row_stats_id }}"></span>
    {% if selected_stats_id %}
      <span id="{{ selected_stats_id }}" class="ms-3"></span>
    {% endif %}
    {% if load_more_btn_id %}
      <button type="button"
              id="{{ load_more_btn_id }}"
              class="btn btn-sm btn-outline-primary ms-3 d-none nsm-ag-load-more-btn">
        {% trans "Load more" %}
      </button>
    {% endif %}
  </div>
  <span
    class="nsm-ag-status-bar-license"
    title="{% trans 'AG Grid Community Edition, MIT License' %}"
  >{% ag_grid_community_license_label %}</span>
</div>
