{% load i18n %}

{% if rules_can_delete %}
<div class="card btn-list sticky-actions d-print-none" data-sticky-position="right" data-sticky-when="selection">
  <div class="btn-list bulk-action-buttons">
    <button type="submit" name="_delete" class="btn btn-red">
      <i class="mdi mdi-trash-can-outline" aria-hidden="true"></i> {% trans "Delete Selected" %}
    </button>
  </div>
</div>
{% endif %}
