{% load i18n %}

<h5 class="d-flex align-items-center gap-2 mb-2 mt-2">
  <span class="badge text-bg-secondary">5</span>
  <i class="mdi mdi-eye-off-outline"></i>
  {% trans "Hide Setup" %}
</h5>
<div class="card mb-4">
  <div class="card-body">
    <p class="text-muted small mb-3">
      {% blocktrans %}
      Remove the <strong>Setup</strong> entry from the Configuration menu. The page
      stays hidden until you set <code>"setup_menu": true</code> in
      <code>PLUGINS_CONFIG["netbox_nsm"]</code> again (toggle
      <code>false</code> → restart → <code>true</code> → restart).
      {% endblocktrans %}
    </p>
    <form method="post" class="m-0">
      {% csrf_token %}
      <input type="hidden" name="action" value="hide_setup_menu">
      <button type="submit" class="btn btn-outline-secondary btn-sm">
        <i class="mdi mdi-eye-off-outline me-1"></i>{% trans "Hide Setup menu" %}
      </button>
    </form>
  </div>
</div>
