<div class="btn-group btn-group-sm flex-wrap nsm-btn-check-group" role="group"{% if widget.attrs.id %} id="{{ widget.attrs.id }}"{% endif %}>
{% for group, options, index in widget.optgroups %}
  {% for option in options %}
    {% include option.template_name with widget=option %}
  {% endfor %}
{% endfor %}
</div>
