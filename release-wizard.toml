# Release wizard configuration for netbox-nsm.
# See scripts/release_wizard.py for usage.

[project]
name = "netbox-nsm"
git_user = "christian"

[repo]
url = "https://github.com/christianbur/netbox-nsm"
dev_branch = "dev"
release_branch = "main"
auto_promote_to_main = true

[changelog]
file = "CHANGELOG.md"
import_unreleased = true

[commit]
files = [
    "pyproject.toml",
    "netbox_nsm/version.py",
    "netbox_nsm/__init__.py",
    "netbox-plugin.yaml",
    "CHANGELOG.md",
]

[[version]]
file = "pyproject.toml"
read = '^version\s*=\s*"([^"]+)"'
write = '^version\s*=\s*"[^"]+"'
replace = 'version = "{version}"'
flags = ["MULTILINE"]

[[version]]
file = "netbox_nsm/version.py"
read = '__version__\s*=\s*"([^"]+)"'
write = '__version__\s*=\s*"[^"]+"'
replace = '__version__ = "{version}"'

[netbox_plugin]
file = "netbox-plugin.yaml"
init_file = "netbox_nsm/__init__.py"

[reminders]
pypi_note = "PyPI publish runs via publish.yml on tag push (Trusted Publisher workflow name must stay publish.yml)."
manual_push_hint = "sudo ./scripts/github_release.sh --version <X.Y.Z> && sudo ./scripts/promote_release_to_main.sh --version <X.Y.Z>"
